<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - Contact</title>
</head>
<body>

    <header>
        <h1>Get In Touch</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home (Bio)</a></li>
            <li><a href="contact.html">Contact Me</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Contact Form</h2>
            <p>Please fill out the form below to send an inquiry or message.</p>

            <form action="#" method="POST">
                <p>
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </p>

                <p>
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </p>

                <p>
                    <label for="message">Message:</label><br>
                    <textarea id="message" name="message" rows="5" cols="40" placeholder="Type your message here..." required></textarea>
                </p>

                <p>
                    <input type="submit" value="Send Message">
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Student Profile. Created for HTML Fundamentals Lab Activity.</p>
    </footer>

</body>
</html>
