<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - Contact</title>
    <style>
        /* Consistent Design System & Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333333;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            text-align: center;
            padding: 2.5rem 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 600;
        }

        nav {
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 1rem;
        }

        nav a {
            text-decoration: none;
            color: #4a5568;
            font-weight: 600;
            font-size: 1.05rem;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: #2a5298;
        }

        main {
            max-width: 600px; /* Narrower width specific for beautiful form rendering */
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        section {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid #edf2f7;
        }

        section h2 {
            color: #1e3c72;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .form-instruction {
            color: #718096;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        /* Beautiful Form Element Containers */
        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #4a5568;
            font-size: 0.9rem;
        }

        /* Clean Input Box Customizations */
        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            background-color: #f8fafc;
            font-size: 1rem;
            color: #2d3748;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            outline: none;
            border-color: #2a5298;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.15);
        }

        textarea {
            resize: vertical;
        }

        /* Modern High-Impact Submit Button */
        input[type="submit"] {
            background-color: #2a5298;
            color: #ffffff;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
            box-shadow: 0 2px 4px rgba(42, 82, 152, 0.2);
        }

        input[type="submit"]:hover {
            background-color: #1e3c72;
        }

        footer {
            text-align: center;
            padding: 2rem 1rem;
            color: #718096;
            font-size: 0.9rem;
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Get In Touch</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home (Bio)</a></li>
            <li><a href="contact.html">Contact Me</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Contact Form</h2>
            <p class="form-instruction">Please fill out the form below to send an inquiry or message.</p>

            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Type your message here..." required></textarea>
                </div>

                <input type="submit" value="Send Message">
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Student Profile. Created for HTML Fundamentals Lab Activity.</p>
    </footer>

</body>
</html>
